<title>Nitrox Study Course</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Agency-neutral, metric Enriched Air Nitrox course: readings, quizzes, formula drills and a final exam.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="designs.css">
<script src="designs.js"></script>
<style>
/* Layout: sticky glass header + left module rail (collapses to a top select on phones) + one reading/quiz pane.
   Signature motif: the yellow cylinder with its green nitrox band, used for progress and the contents label. */

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15.5px/1.6 var(--f-body);
  background-image:radial-gradient(1200px 600px at 85% -10%,var(--bg2),transparent 60%),radial-gradient(900px 500px at -10% 110%,var(--bg2),transparent 60%);
  background-attachment:fixed;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface-solid)}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:clamp(1.9rem,4.5vw,2.9rem);font-weight:800;letter-spacing:-.02em}
h2{font-size:1.5rem;font-weight:700;letter-spacing:-.01em}
h3{font-size:1.12rem;font-weight:700;margin-top:1.6em}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font:600 .72rem/1 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:14px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1280px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font:800 1.08rem var(--f-display);white-space:nowrap}
.tankico{width:14px;height:30px;border-radius:7px 7px 4px 4px;background:linear-gradient(var(--tank) 0 28%,var(--band) 28% 46%,var(--tank) 46%);box-shadow:inset -3px 0 0 rgba(0,0,0,.12)}
.top-progress{flex:1;display:flex;align-items:center;gap:10px;min-width:0}
.bandbar{flex:1;height:10px;border-radius:99px;background:var(--line);overflow:hidden;max-width:340px}
.bandbar>i{display:block;height:100%;width:0;background:repeating-linear-gradient(90deg,var(--tank) 0 18px,var(--band) 18px 24px);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.top-progress span{font:600 .8rem var(--f-mono);color:var(--muted);white-space:nowrap}
.iconbtn{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;padding:6px 10px;font:600 .8rem var(--f-body);cursor:pointer}
.iconbtn:hover{background:var(--accent-soft)}
select.iconbtn{max-width:6.2rem;flex:0 0 auto;appearance:auto;padding:6px 6px}
select.iconbtn option{color:#000;background:#fff}

.shell{display:grid;grid-template-columns:280px minmax(0,1fr);gap:28px;max-width:1280px;margin:0 auto;padding-block:24px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
nav.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);align-self:start;max-height:calc(100vh - 100px);overflow:auto;display:flex;flex-direction:column;gap:4px}
.rail .grp{margin:14px 0 6px 10px}
.rail a{display:grid;grid-template-columns:30px minmax(0,1fr) auto;align-items:center;gap:8px;padding:8px 10px;border-radius:11px;text-decoration:none;color:var(--ink);font-weight:500;font-size:.92rem;line-height:1.3;transition:background .15s}
.rail a:hover{background:var(--accent-soft)}
.rail a.on{background:var(--surface);box-shadow:var(--shadow);border:1px solid var(--line)}
.rail .n{font:700 .78rem var(--f-mono);color:var(--muted);text-align:center}
.chip{font:600 .68rem var(--f-mono);padding:2px 7px;border-radius:99px;white-space:nowrap;background:var(--line);color:var(--muted)}
.chip.done{background:var(--good-soft);color:var(--good)}
.chip.part{background:var(--warn-soft);color:var(--warn)}
.chip.fail{background:var(--bad-soft);color:var(--bad)}
.mobnav{display:none}

main{min-width:0}
.view{animation:rise .35s ease both}
@keyframes rise{from{transform:translateY(6px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.view,.bandbar>i,.opt{animation:none!important;transition:none!important}}

.glass{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.reading{padding:28px clamp(18px,4vw,40px);max-width:820px}
.reading p,.reading li{max-width:68ch}
.reading ul,.reading ol{padding-left:1.2em;display:grid;gap:4px}
.lede{font-size:1.06rem;color:var(--muted);margin-top:10px}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.meta span{font:600 .74rem var(--f-mono);padding:4px 9px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.callout{border-left:4px solid var(--tank);background:var(--warn-soft);padding:12px 16px;border-radius:0 10px 10px 0;margin:16px 0}
.callout.key{border-color:var(--accent);background:var(--accent-soft)}
.callout.danger{border-color:var(--bad);background:var(--bad-soft)}
.callout b:first-child{display:block;font-family:var(--f-display);margin-bottom:2px}
.formula{font:700 1.02rem var(--f-mono);background:var(--surface-solid);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:12px 0;overflow-x:auto;white-space:nowrap}
.formula small{display:block;font:500 .78rem var(--f-body);color:var(--muted);white-space:normal;margin-top:4px}
.tbl{overflow-x:auto;margin:14px 0;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:8px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font:600 .74rem var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--accent-soft)}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right}
.src{font-size:.78rem;color:var(--muted);margin-top:22px;border-top:1px dashed var(--line);padding-top:10px}

.quiz{margin-top:26px;max-width:820px;display:grid;gap:14px}
.quiz-head{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}
.q{padding:18px 20px}
.q .qn{font:700 .74rem var(--f-mono);color:var(--muted)}
.q .qt{font-weight:600;margin:4px 0 12px;font-size:1.01rem}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;border:1px solid var(--line);background:var(--surface-solid);color:var(--ink);border-radius:11px;padding:10px 12px;font:inherit;cursor:pointer;transition:transform .12s,border-color .12s,background .12s}
.opt:hover:not(:disabled){border-color:var(--accent);transform:translateX(2px)}
.opt .k{font:700 .78rem var(--f-mono);color:var(--muted);min-width:1.2em;padding-top:2px}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.why{margin-top:10px;font-size:.9rem;padding:10px 12px;border-radius:10px;background:var(--accent-soft)}
.why.bad{background:var(--bad-soft)}
.score{padding:18px 20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.big{font:800 2.2rem var(--f-display)}
.btn{border:0;background:var(--accent);color:var(--accent-ink);font:600 .92rem var(--f-body);padding:10px 16px;border-radius:11px;cursor:pointer;transition:transform .12s,filter .12s}
.btn:hover{transform:translateY(-1px);filter:brightness(1.07)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--accent-soft)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.hero{padding:30px clamp(18px,4vw,40px);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:center}
.hero p{max-width:60ch}
.cyl{width:92px;height:220px;border-radius:44px 44px 22px 22px;background:linear-gradient(90deg,rgba(0,0,0,.08),transparent 30%,rgba(255,255,255,.35) 45%,transparent 60%,rgba(0,0,0,.12)),linear-gradient(var(--tank) 0 20%,var(--band) 20% 34%,var(--tank) 34%);position:relative;box-shadow:var(--shadow)}
.cyl::before{content:"";position:absolute;left:34px;top:-22px;width:24px;height:26px;border-radius:6px 6px 0 0;background:var(--muted)}
.cyl .lbl{position:absolute;left:10px;right:10px;top:46%;background:#fff;color:#0b2430;border-radius:6px;padding:6px 5px;font:700 .62rem/1.35 var(--f-mono);text-align:center;transform:rotate(-2deg)}
.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-top:18px}
.mcard{padding:16px;text-decoration:none;color:var(--ink);display:flex;flex-direction:column;gap:6px;transition:transform .15s,border-color .15s}
.mcard:hover{transform:translateY(-2px);border-color:var(--accent)}
.mcard .t{font:700 1.02rem var(--f-display)}
.mcard .d{font-size:.85rem;color:var(--muted);flex:1}
.steps{counter-reset:s;list-style:none;padding:0!important}
.steps li{counter-increment:s;display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;align-items:start}
.steps li::before{content:counter(s);font:700 .85rem var(--f-mono);width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}

.calc{padding:20px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;margin-top:16px}
.field{display:grid;gap:4px}
.field label{font:600 .8rem var(--f-body);color:var(--muted)}
.field input,.field select{font:600 1rem var(--f-mono);padding:9px 11px;border-radius:10px;border:1px solid var(--line);background:var(--surface-solid);color:var(--ink);width:100%}
.ctag{background:#fffdf3;color:#0b2430;border-radius:10px;padding:14px 16px;border:2px dashed #b48a00;font:600 .9rem/1.7 var(--f-mono);box-shadow:var(--shadow)}
.ctag .h{font:800 .72rem var(--f-body);letter-spacing:.14em;text-transform:uppercase;border-bottom:2px solid #178f4c;padding-bottom:4px;margin-bottom:6px;color:#178f4c}
.ctag .warn{color:#c93c32;font-weight:700}
.ctag dl{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;margin:0}
.ctag dd{margin:0;text-align:right}

.exam-bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:10px 0 4px}
.exam-bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.streak{font:700 .85rem var(--f-mono);color:var(--muted)}

@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr);gap:16px;padding-top:14px}
  nav.rail{display:none}
  .mobnav{display:block}
  .mobnav select{width:100%;font:600 .95rem var(--f-body);padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface-solid);color:var(--ink)}
  .hero{grid-template-columns:minmax(0,1fr)}
  .cyl{display:none}
  .calc{grid-template-columns:minmax(0,1fr)}
  .top-progress .bandbar{max-width:none}
}
@media (max-width:480px){.brand b{display:none}}
</style>

<header class="top">
  <div class="top-in">
    <a class="brand" href="#home"><span class="tankico" aria-hidden="true"></span><b>Nitrox Study Course</b></a>
    <div class="top-progress" title="Modules passed (quiz score 80% or more)">
      <div class="bandbar" aria-hidden="true"><i id="pbar"></i></div>
      <span id="ptext">0/9 passed</span>
    </div>
    <select class="iconbtn" id="designSel" aria-label="Design"></select>
    <button class="iconbtn" id="themeBtn" type="button" aria-label="Toggle light or dark theme">Theme</button>
  </div>
</header>

<div class="shell">
  <nav class="rail" id="rail" aria-label="Course sections"></nav>
  <main>
    <div class="mobnav"><label class="eyebrow" for="mobsel">Go to</label><select id="mobsel"></select></div>
    <div id="view"></div>
  </main>
</div>

<script src="nitrox-math.js"></script>
<script src="content.js"></script>
<script>
(function(){
"use strict";

/* ---------- storage (per-browser convenience; page works without it) ---------- */
var KEY="nitrox-course-v1";
function load(){try{var s=JSON.parse(localStorage.getItem(KEY)||"{}");return s&&typeof s==="object"?s:{};}catch(e){return {};}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}
var state=load(); state.quiz=state.quiz||{}; state.exam=state.exam||{history:[]}; state.drill=state.drill||{best:0};

/* ---------- helpers (maths and content live in nitrox-math.js and content.js) ---------- */
var M=window.NitroxMath, MODULES=window.NitroxContent.MODULES;
var shuffle=M.shuffle, pick=M.pick, fl=M.fl, ce=M.ce, f1=M.f1, f2=M.f2, NOAA=M.NOAA, MIXES=M.MIXES, genQ=M.genQ;
function $(s,r){return (r||document).querySelector(s);}
function el(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
var PO2="PO<sub>2</sub>", FO2="FO<sub>2</sub>", FN2="FN<sub>2</sub>";

/* ---------- quiz rendering ---------- */
function renderQuestion(q,idx,opts){
  opts=opts||{};
  var card=el("div","q glass");
  card.appendChild(el("div","qn",(opts.label||("Question "+(idx+1)))+(q.tag?" · "+q.tag:"")));
  card.appendChild(el("div","qt",q.q));
  var box=el("div","opts"); card.appendChild(box);
  var order=shuffle(q.a.map(function(t,i){return {t:t,ok:i===0};}));
  var letters="ABCD";
  order.forEach(function(o,i){
    var b=el("button","opt","<span class='k'>"+letters[i]+"</span><span>"+o.t+"</span>");
    b.type="button";
    b.addEventListener("click",function(){
      if(card.dataset.done)return; card.dataset.done="1";
      Array.prototype.forEach.call(box.children,function(c,j){c.disabled=true;if(order[j].ok)c.classList.add("right");});
      if(!o.ok)b.classList.add("wrong");
      if(!opts.silent){var w=el("div","why"+(o.ok?"":" bad"),"<b>"+(o.ok?"Correct.":"Not quite.")+"</b> "+q.why);card.appendChild(w);}
      if(opts.onAnswer)opts.onAnswer(o.ok,o.t);
    });
    box.appendChild(b);
  });
  return card;
}

function moduleStatus(id){var r=state.quiz[id];if(!r)return null;return r.best;}
function chipFor(id){var b=moduleStatus(id);if(b==null)return "<span class='chip'>new</span>";if(b>=80)return "<span class='chip done'>"+b+"%</span>";return "<span class='chip part'>"+b+"%</span>";}

function moduleQuiz(mod,host){
  host.innerHTML="";
  var head=el("div","quiz-head","<div><div class='eyebrow'>Check your understanding</div><h2>Module quiz</h2></div><div class='mono' style='color:var(--muted);font-size:.85rem'>Pass mark 80% · best so far "+(moduleStatus(mod.id)==null?"none":moduleStatus(mod.id)+"%")+"</div>");
  host.appendChild(head);
  var qs=shuffle(mod.quiz), right=0, answered=0;
  var scoreBox=el("div","score glass"); scoreBox.hidden=true;
  qs.forEach(function(q,i){host.appendChild(renderQuestion(q,i,{onAnswer:function(ok){answered++;if(ok)right++;if(answered===qs.length)finish();}}));});
  host.appendChild(scoreBox);
  function finish(){
    var pct=Math.round(right/qs.length*100);
    var prev=state.quiz[mod.id]; state.quiz[mod.id]={best:Math.max(pct,prev?prev.best:0),last:pct,at:Date.now()}; save(); refreshChrome();
    scoreBox.hidden=false;
    var idx=MODULES.indexOf(mod), next=MODULES[idx+1];
    scoreBox.innerHTML="<div class='big num' style='color:"+(pct>=80?"var(--good)":"var(--bad)")+"'>"+pct+"%</div><div style='flex:1;min-width:200px'><b>"+right+" of "+qs.length+" correct.</b> "+(pct>=80?"Module passed.":"Below 80%. Reread the highlighted sections and try again.")+"</div>";
    var row=el("div","row");
    var again=el("button","btn ghost","Retry with new order"); again.type="button"; again.onclick=function(){moduleQuiz(mod,host);host.scrollIntoView({behavior:"smooth"});};
    row.appendChild(again);
    if(next){var nx=el("a","btn","Next: "+next.short+" →");nx.href="#"+next.id;nx.style.textDecoration="none";row.appendChild(nx);}
    else{var ex=el("a","btn","Take the final exam →");ex.href="#exam";ex.style.textDecoration="none";row.appendChild(ex);}
    scoreBox.appendChild(row);
    scoreBox.scrollIntoView({behavior:"smooth",block:"center"});
  }
}

/* ---------- views ---------- */
var V=$("#view");
function view(html){V.innerHTML="";var d=el("div","view",html||"");V.appendChild(d);window.scrollTo(0,0);return d;}

function homeView(){
  var passed=MODULES.filter(function(m){return (moduleStatus(m.id)||0)>=80;}).length;
  var ex=state.exam.best;
  var d=view(
  "<section class='hero glass'><div><div class='eyebrow'>Enriched Air Nitrox · metric · any agency</div><h1>Get nitrox certified, ready for any agency</h1>"+
  "<p class='lede'>Nine short modules built from the TDI standards, both RAID manuals, the DAN Nitrox Workshop and an SSI class. Each module has a reading followed by a quiz. Then drill the calculations and sit the final exam. All depths are in metres and all pressures in bar.</p>"+
  "<div class='row' style='margin-top:18px'><a class='btn' style='text-decoration:none' href='#"+(MODULES.find(function(m){return (moduleStatus(m.id)||0)<80;})||{id:"exam"}).id+"'>"+(passed?"Continue":"Start Module 1")+" →</a><a class='btn ghost' style='text-decoration:none' href='#exam'>Final exam</a><a class='btn ghost' style='text-decoration:none' href='#formulas'>Formulas and calculator</a></div>"+
  "<div class='meta'><span>"+passed+"/9 modules passed</span><span>Exam best: "+(ex==null?"not yet":ex+"%")+"</span><span>Drill streak record: "+(state.drill.best||0)+"</span></div></div>"+
  "<div class='cyl' aria-hidden='true'><div class='lbl'>EAN32<br>MOD 33 m<br>JD 25/11</div></div></section>"+
  "<h2 style='margin-top:30px'>Modules</h2><div class='grid-cards' id='cards'></div>"+
  "<section class='reading glass' style='margin-top:26px'><h2>Your path to the card</h2><ol class='steps' style='margin-top:12px'>"+
  "<li><div><b>Work through Modules 1 to 9</b> and pass each quiz with 80% or more.</div></li>"+
  "<li><div><b>Drill the calculations</b> until you can do MOD, best mix and EAD without hesitating.</div></li>"+
  "<li><div><b>Score 90% or more on the final exam</b> twice in a row.</div></li>"+
  "<li><div><b>Practical sign-off:</b> analyse, label, log and set your computer in front of the instructor.</div></li></ol>"+
  "<h3>Sources in this repo (<span class='mono'>certifiers/</span>)</h3><div class='tbl'><table><tr><th>Folder</th><th>What it is</th></tr>"+
  "<tr><td class='mono'>tdi/</td><td>TDI Standards and Procedures, Parts 1 to 3, plus the Advanced Nitrox and instructor excerpts (v0126)</td></tr>"+
  "<tr><td class='mono'>raid/</td><td>RAID Nitrox Open Water training manual and Nitrox Management manual</td></tr>"+
  "<tr><td class='mono'>dan/</td><td>DAN Nitrox Workshop Proceedings, November 2000 (the consensus recommendations)</td></tr>"+
  "<tr><td class='mono'>SSI/</td><td>Transcript and summary of a full SSI Enriched Air Nitrox class</td></tr>"+
  "<tr><td class='mono'>naui/</td><td>Scribd link (preview only) and notes from the Scuba Diving magazine nitrox guide</td></tr>"+
  "<tr><td class='mono'>padi/</td><td>PADI Enriched Air Diver Specialty Course Instructor Guide (not yet merged into the modules)</td></tr><tr><td class='mono'>bsac/, cmas/</td><td>Empty, waiting for material</td></tr></table></div>"+
  "<div class='row' style='margin-top:10px'><button class='btn ghost' type='button' id='resetBtn'>Reset my progress</button><span id='resetMsg' class='mono' style='font-size:.8rem;color:var(--muted)'></span></div></section>");
  var cards=$("#cards",d);
  MODULES.forEach(function(m,i){var a=el("a","mcard glass","<div class='row' style='justify-content:space-between'><span class='eyebrow'>Module "+(i+1)+" · "+m.mins+" min</span>"+chipFor(m.id)+"</div><div class='t'>"+m.title+"</div><div class='d'>"+m.summary+"</div>");a.href="#"+m.id;cards.appendChild(a);});
  var rb=$("#resetBtn",d),armed=false;
  rb.onclick=function(){if(!armed){armed=true;rb.textContent="Tap again to reset everything";$("#resetMsg",d).textContent="This clears quiz and exam scores saved in this browser.";return;}
    state={quiz:{},exam:{history:[]},drill:{best:0}};save();refreshChrome();homeView();};
}

function moduleView(mod){
  var i=MODULES.indexOf(mod);
  var d=view("<article class='reading glass'><div class='eyebrow'>Module "+(i+1)+" of 9 · reading</div><h1 style='font-size:clamp(1.6rem,3.6vw,2.3rem);margin-top:6px'>"+mod.title+"</h1><p class='lede'>"+mod.summary+"</p><div class='meta'><span>~"+mod.mins+" min read</span><span>"+mod.quiz.length+" quiz questions</span><span>Best: "+(moduleStatus(mod.id)==null?"none":moduleStatus(mod.id)+"%")+"</span></div>"+mod.reading+"</article><section class='quiz' id='quiz'></section>");
  moduleQuiz(mod,$("#quiz",d));
}

function formulasView(){
  var d=view(
  "<article class='reading glass'><div class='eyebrow'>Reference</div><h1 style='font-size:clamp(1.6rem,3.6vw,2.3rem);margin-top:6px'>Formula sheet</h1>"+
  "<div class='formula'>P<sub>abs</sub> = D &divide; 10 + 1<small>Absolute pressure in bar from depth in metres of seawater.</small></div>"+
  "<div class='formula'>"+PO2+" = "+FO2+" &times; P<sub>abs</sub><small>Keep it at or below 1.4 bar working, and never over 1.6 bar.</small></div>"+
  "<div class='formula'>MOD = ("+PO2+"max &divide; "+FO2+" &minus; 1) &times; 10<small><b>Round down.</b></small></div>"+
  "<div class='formula'>Best "+FO2+" = "+PO2+"max &divide; P<sub>abs</sub><small><b>Round down</b>, and cap at 40%.</small></div>"+
  "<div class='formula'>EAD = ("+FN2+" &divide; 0.79 &times; P<sub>abs</sub> &minus; 1) &times; 10<small><b>Round up</b> for air tables.</small></div>"+
  "<div class='formula'>CNS% = minutes &divide; NOAA limit &times; 100<small>Halves roughly every 90 minutes at the surface.</small></div>"+
  "</article>"+
  "<section class='calc glass'><div style='display:grid;gap:12px;align-content:start'><div><div class='eyebrow'>Interactive</div><h2>Nitrox calculator</h2></div>"+
  "<div class='field'><label for='cO2'>Analysed O₂ (%)</label><input id='cO2' type='number' min='21' max='40' step='0.1' value='32'></div>"+
  "<div class='field'><label for='cD'>Planned depth (m)</label><input id='cD' type='number' min='0' max='60' step='1' value='28'></div>"+
  "<div class='field'><label for='cL'>Working PO₂ limit</label><select id='cL'><option value='1.4'>1.4 bar (default)</option><option value='1.3'>1.3 bar (conservative)</option><option value='1.2'>1.2 bar</option><option value='1.6'>1.6 bar (contingency)</option></select></div>"+
  "<div class='field'><label for='cT'>Bottom time (min)</label><input id='cT' type='number' min='1' max='300' step='1' value='40'></div></div>"+
  "<div id='cOut' aria-live='polite'></div></section>"+
  "<article class='reading glass' style='margin-top:16px'><h2>Quick reference: MOD by mix</h2><div class='tbl'><table><tr><th>Mix</th><th class='num'>1.2 bar</th><th class='num'>1.3 bar</th><th class='num'>1.4 bar</th><th class='num'>1.6 bar</th></tr>"+
  MIXES.filter(function(m){return m%2===0;}).map(function(m){var f=m/100;return "<tr><td class='mono'>EAN"+m+"</td>"+[1.2,1.3,1.4,1.6].map(function(l){return "<td class='num'>"+fl((l/f-1)*10)+" m</td>";}).join("")+"</tr>";}).join("")+
  "</table></div><p class='src'>Values rounded down. Your base certification depth still applies.</p></article>");
  function calc(){
    var o=parseFloat($("#cO2",d).value),D=parseFloat($("#cD",d).value),L=parseFloat($("#cL",d).value),T=parseFloat($("#cT",d).value);
    var out=$("#cOut",d);
    if(!(o>=21&&o<=40)||!(D>=0)||!(T>0)){out.innerHTML="<div class='callout danger'><b>Check the inputs</b>Enter O₂ between 21 and 40%, a depth of 0 m or more, and a bottom time above 0.</div>";return;}
    var f=o/100,fe=Math.floor(o)/100,P=D/10+1,po=f*P,mod=fl((L/f-1)*10),con=fl((1.6/f-1)*10),best=Math.min(40,fl(L/P*100)),ead=ce(((1-fe)/0.79*P-1)*10);
    var row=M.noaaRow(po);
    var cns=row&&po>0.5?Math.round(T/row[1]*100):0;
    var over=po>L+1e-9, hard=po>1.6+1e-9;
    out.innerHTML="<div class='ctag'><div class='h'>Enriched air · "+o+"% O₂</div><dl>"+
      "<dt>PO₂ at "+D+" m</dt><dd class='"+(over?"warn":"")+"'>"+f2(po)+" bar</dd>"+
      "<dt>MOD at "+L.toFixed(1)+"</dt><dd>"+mod+" m</dd>"+
      "<dt>Contingency (1.6)</dt><dd>"+con+" m</dd>"+
      "<dt>Best mix for "+D+" m</dt><dd>EAN"+best+"</dd>"+
      "<dt>EAD (air table)</dt><dd>"+(ead<0?"shallower than 0 m":ead+" m")+"</dd>"+
      "<dt>CNS for "+T+" min</dt><dd class='"+(cns>=80?"warn":"")+"'>"+(hard?"over 1.6 bar":(po<=0.5?"negligible":cns+"%"))+"</dd></dl>"+
      (hard?"<p class='warn' style='margin:8px 0 0'>Over 1.6 bar. Don't dive this plan.</p>":over?"<p class='warn' style='margin:8px 0 0'>Over your "+L.toFixed(1)+" bar limit. Go shallower or use a leaner mix (EAN"+best+").</p>":"<p style='margin:8px 0 0;color:#178f4c;font-weight:700'>Within your "+L.toFixed(1)+" bar limit.</p>")+
      "<p style='margin:6px 0 0;font:500 .72rem var(--f-body);color:#4b6670'>PO₂, MOD and CNS use the analysed O₂. EAD rounds the O₂ down (more nitrogen, which is conservative). CNS uses the next higher NOAA row. For study only. Use your dive computer and your agency's tables for real dives.</p></div>";
  }
  ["#cO2","#cD","#cL","#cT"].forEach(function(s){$(s,d).addEventListener("input",calc);});
  calc();
}

function drillsView(){
  var streak=0,total=0,right=0;
  var d=view("<article class='reading glass'><div class='eyebrow'>Unlimited practice</div><h1 style='font-size:clamp(1.6rem,3.6vw,2.3rem);margin-top:6px'>Calculation drills</h1><p class='lede'>Randomly generated questions on pressure, PO₂, MOD, best mix, EAD and CNS. The wrong answers come from the mistakes people actually make: forgetting the +1 bar, rounding the wrong way, using the wrong limit.</p><div class='row'><span class='streak' id='st'>Streak 0 · 0/0 · record "+(state.drill.best||0)+"</span></div></article><section class='quiz' id='dq'></section>");
  var host=$("#dq",d);
  function next(){
    host.innerHTML="";
    var q=genQ();
    host.appendChild(renderQuestion(q,0,{label:"Drill "+(total+1),onAnswer:function(ok){total++;if(ok){right++;streak++;if(streak>(state.drill.best||0)){state.drill.best=streak;save();}}else streak=0;
      $("#st",d).textContent="Streak "+streak+" · "+right+"/"+total+" · record "+(state.drill.best||0);
      var b=el("button","btn","Next question →");b.type="button";b.style.marginTop="12px";b.onclick=next;host.firstChild.appendChild(b);b.focus();}}));
  }
  next();
}

function examView(){
  var hist=state.exam.history||[];
  var d=view("<article class='reading glass'><div class='eyebrow'>Final assessment</div><h1 style='font-size:clamp(1.6rem,3.6vw,2.3rem);margin-top:6px'>Final exam</h1>"+
  "<p class='lede'>Questions drawn at random from all nine modules, plus generated calculations. You get no feedback until the end, as in a real agency exam. Agency pass marks are typically 75 to 80%. Aim for <b>90%</b>.</p>"+
  "<div class='row' style='margin-top:14px'><button class='btn' type='button' data-n='20'>Short exam · 20 questions</button><button class='btn ghost' type='button' data-n='40'>Full exam · 40 questions</button></div>"+
  (hist.length?"<h3>Recent attempts</h3><div class='tbl'><table><tr><th>Date</th><th class='num'>Questions</th><th class='num'>Score</th></tr>"+hist.slice(-8).reverse().map(function(h){return "<tr><td>"+new Date(h.at).toLocaleString()+"</td><td class='num'>"+h.n+"</td><td class='num'><span class='chip "+(h.pct>=90?"done":h.pct>=80?"part":"fail")+"'>"+h.pct+"%</span></td></tr>";}).join("")+"</table></div>":"")+
  "</article><section class='quiz' id='ex'></section>");
  Array.prototype.forEach.call(d.querySelectorAll("[data-n]"),function(b){b.onclick=function(){runExam(+b.dataset.n,$("#ex",d));};});
}
function runExam(n,host){
  var bank=[];MODULES.forEach(function(m,i){m.quiz.forEach(function(q){bank.push({q:q.q,a:q.a,why:q.why,tag:"M"+(i+1)+" "+m.short,mod:i});});});
  var nCalc=Math.round(n*0.25), qs=shuffle(bank).slice(0,n-nCalc);
  for(var k=0;k<nCalc;k++){var g=genQ();g.mod=-1;qs.push(g);}
  qs=shuffle(qs);
  var i=0,res=[];
  function show(){
    host.innerHTML="";
    var top=el("div","glass q","<div class='row' style='justify-content:space-between'><span class='eyebrow'>Question "+(i+1)+" of "+n+"</span><span class='mono' style='font-size:.8rem;color:var(--muted)'>no feedback until the end</span></div><div class='exam-bar'><i style='width:"+(i/n*100)+"%'></i></div>");
    host.appendChild(top);
    var q=qs[i];
    var card=renderQuestion({q:q.q,a:q.a,why:q.why},i,{silent:true,label:"Q"+(i+1),onAnswer:function(ok,t){res.push({q:q,ok:ok,pick:t});setTimeout(function(){i++;if(i<n)show();else done();},350);}});
    host.appendChild(card);
    host.scrollIntoView({behavior:"smooth",block:"start"});
  }
  function done(){
    var right=res.filter(function(r){return r.ok;}).length,pct=Math.round(right/n*100);
    state.exam.history=(state.exam.history||[]).concat([{at:Date.now(),n:n,pct:pct}]).slice(-20);
    state.exam.best=Math.max(state.exam.best||0,pct);save();refreshChrome();
    var by={};res.forEach(function(r){var k=r.q.mod<0?"Calculations":MODULES[r.q.mod].short;by[k]=by[k]||[0,0];by[k][1]++;if(r.ok)by[k][0]++;});
    host.innerHTML="";
    var s=el("div","score glass","<div class='big num' style='color:"+(pct>=90?"var(--good)":pct>=80?"var(--warn)":"var(--bad)")+"'>"+pct+"%</div><div style='flex:1;min-width:220px'><b>"+right+" of "+n+" correct.</b> "+(pct>=90?"Exam-ready at any agency.":pct>=80?"A pass at most agencies. Push for 90%.":"Not yet. Review the modules below and try again.")+"</div>");
    var again=el("button","btn","New exam");again.type="button";again.onclick=function(){runExam(n,host);};s.appendChild(again);
    host.appendChild(s);
    var bd=el("div","glass reading","<h2>By topic</h2><div class='tbl'><table><tr><th>Topic</th><th class='num'>Score</th></tr>"+Object.keys(by).map(function(k){var v=by[k],p=Math.round(v[0]/v[1]*100);return "<tr><td>"+k+"</td><td class='num'><span class='chip "+(p>=80?"done":p>=60?"part":"fail")+"'>"+v[0]+"/"+v[1]+"</span></td></tr>";}).join("")+"</table></div>");
    host.appendChild(bd);
    var wrong=res.filter(function(r){return !r.ok;});
    if(wrong.length){host.appendChild(el("h2",null,"Review your misses"));
      wrong.forEach(function(r,j){host.appendChild(el("div","q glass","<div class='qn'>"+(r.q.tag||"")+"</div><div class='qt'>"+r.q.q+"</div><div class='why bad'><b>You picked:</b> "+r.pick+"</div><div class='why'><b>Answer:</b> "+r.q.a[0]+"<br>"+r.q.why+"</div>"));});}
    host.scrollIntoView({behavior:"smooth",block:"start"});
  }
  show();
}

/* ---------- chrome: rail, mobile select, progress, routing ---------- */
var ROUTES=[{id:"home",label:"Course home",n:"⌂"}].concat(MODULES.map(function(m,i){return {id:m.id,label:m.short,n:String(i+1),mod:m};})).concat([{id:"formulas",label:"Formulas and calculator",n:"ƒ",grp:"Practice"},{id:"drills",label:"Calculation drills",n:"∞"},{id:"exam",label:"Final exam",n:"✓"}]);
function refreshChrome(){
  var passed=MODULES.filter(function(m){return (moduleStatus(m.id)||0)>=80;}).length;
  $("#pbar").style.width=(passed/9*100)+"%"; $("#ptext").textContent=passed+"/9 passed";
  var rail=$("#rail"),cur=(location.hash||"#home").slice(1);
  rail.innerHTML="<div class='eyebrow grp'>Readings and quizzes</div>";
  ROUTES.forEach(function(r){
    if(r.grp)rail.appendChild(el("div","eyebrow grp",r.grp));
    var right=r.mod?chipFor(r.id):(r.id==="exam"&&state.exam.best!=null?"<span class='chip "+(state.exam.best>=90?"done":"part")+"'>"+state.exam.best+"%</span>":"");
    var a=el("a",cur===r.id?"on":"","<span class='n'>"+r.n+"</span><span>"+r.label+"</span>"+right);a.href="#"+r.id;rail.appendChild(a);
  });
  var sel=$("#mobsel");sel.innerHTML=ROUTES.map(function(r){var b=r.mod?moduleStatus(r.id):null;return "<option value='"+r.id+"'"+(cur===r.id?" selected":"")+">"+(r.mod?"Module "+r.n+": ":"")+r.label+(b!=null?" ("+b+"%)":"")+"</option>";}).join("");
}
$("#mobsel").addEventListener("change",function(e){location.hash=e.target.value;});
function route(){
  var id=(location.hash||"#home").slice(1);
  var m=MODULES.find(function(x){return x.id===id;});
  if(m)moduleView(m);else if(id==="formulas")formulasView();else if(id==="drills")drillsView();else if(id==="exam")examView();else homeView();
  refreshChrome();
}
window.addEventListener("hashchange",route);

/* theme toggle: cycles system → light → dark; remembered per browser */
var themes=[null,"light","dark"],ti=0;
try{var st=localStorage.getItem(KEY+"-theme");if(st){ti=themes.indexOf(st);if(ti<0)ti=0;}}catch(e){}
function applyTheme(){var t=themes[ti];if(t)document.documentElement.setAttribute("data-theme",t);else document.documentElement.removeAttribute("data-theme");$("#themeBtn").textContent=t?(t==="dark"?"Dark":"Light"):"Auto";try{if(t)localStorage.setItem(KEY+"-theme",t);else localStorage.removeItem(KEY+"-theme");}catch(e){}}
$("#themeBtn").addEventListener("click",function(){ti=(ti+1)%3;applyTheme();});
applyTheme();

(function(){
  var sel=$("#designSel"),ND=window.NitroxDesigns;
  if(!sel||!ND){if(sel)sel.hidden=true;return;}
  window.NITROX_DESIGNS.forEach(function(d){var o=document.createElement("option");o.value=d.id;o.textContent=d.name;sel.appendChild(o);});
